<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黄色奶娃 (Naiwa) 矢量图 & 滑雪大冒险角色动作预览台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #facc15;
      --accent-hover: #fde047;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 24px 64px;
      line-height: 1.5;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .badge {
      background: rgba(250, 204, 21, 0.16);
      color: var(--accent);
      border: 1px solid rgba(250, 204, 21, 0.4);
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* Interactive Ski Safari Stage */
    .stage-box {
      background: linear-gradient(180deg, #1e3a8a 0%, #38bdf8 55%, #e0f2fe 100%);
      border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      height: 350px;
      margin-bottom: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .snow-slope {
      position: absolute;
      bottom: -70px;
      left: -10%;
      width: 125%;
      height: 195px;
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
      transform: rotate(9deg);
      box-shadow: 0 -6px 20px rgba(255, 255, 255, 0.65);
    }
    .stage-character {
      position: absolute;
      left: 34%;
      bottom: 86px;
      width: 240px;
      height: 222px;
      transform: rotate(9deg);
      transition: transform 0.25s ease, bottom 0.25s ease;
      pointer-events: none;
    }
    .stage-character.jumping {
      bottom: 155px;
      transform: rotate(-4deg);
    }
    .stage-character img, .stage-character object {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stage-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    h2 {
      font-size: 19px;
      margin: 32px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .preview-frame {
      width: 180px;
      height: 170px;
      background: radial-gradient(circle at 50% 60%, #334155 0%, #0f172a 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .preview-frame object, .preview-frame img {
      max-width: 92%;
      max-height: 92%;
    }
    .card-title { font-weight: 600; font-size: 14px; margin-bottom: 3px; text-align: center; }
    .card-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>
          <span>🐸 黄色奶娃 (Yellow Naiwa) 矢量角色资产库</span>
          <span class="badge">SVG 矢量 + 滑雪大冒险专属动作</span>
        </h1>
        <p class="subtitle">包含 12 个分层骨骼可动矢量动作 + 6 个原图3D矢量化滑雪动作 + 81 帧原素材逐帧纯路径 SVG</p>
      </div>
    </header>

    <!-- Live Interactive Ski Safari Preview Stage -->
    <div class="stage-box">
      <div class="stage-controls">
        <div class="btn-group" id="actionBtns">
          <button class="active" data-action="01-ski-glide.svg" data-traced="traced-01-ski-glide.svg" data-jump="0">🎿 基础滑行</button>
          <button data-action="02-ski-boost.svg" data-traced="traced-02-ski-boost.svg" data-jump="0">🔥 俯冲加速</button>
          <button data-action="03-ski-jump-laugh.svg" data-traced="traced-03-ski-jump-laugh.svg" data-jump="1">😆 腾空捧腹大笑</button>
          <button data-action="04-ski-backflip.svg" data-traced="traced-04-ski-backflip.svg" data-jump="1">🌀 空中后空翻</button>
          <button data-action="05-ski-belly-slide.svg" data-traced="traced-05-ski-belly-slide.svg" data-jump="0">🤣 笑倒躺滑</button>
          <button data-action="06-ski-crash.svg" data-traced="traced-06-ski-crash.svg" data-jump="0">💫 摔倒撞雪</button>
          <button data-action="07-ski-ride-penguin.svg" data-traced="../actions/07-ski-ride-penguin.svg" data-jump="0">🐧 骑乘企鹅</button>
        </div>
        <div class="btn-group" id="modeBtns">
          <button class="active" data-mode="skeletal">✨ 分层骨骼矢量 (Skeletal)</button>
          <button data-mode="traced">🎨 原图3D矢量化 (Traced)</button>
        </div>
      </div>

      <div class="snow-slope"></div>
      <div class="stage-character" id="stageChar">
        <object id="stageSvg" type="image/svg+xml" data="./ski-safari-rig/actions/01-ski-glide.svg"></object>
      </div>
    </div>

    <h2>1. 《滑雪大冒险》专属 + 原版动作 · 分层骨骼可动矢量 SVG (12 组)</h2>
    <div class="grid" id="skeletalGrid"></div>

    <h2>2. 原图 3D 矢量化轮廓 + 滑雪装备组合 SVG (6 组)</h2>
    <div class="grid" id="tracedSkiGrid"></div>

    <h2>3. 原素材提取逐帧矢量化 SVG 序列帧播放器 (共 81 帧纯 &lt;path&gt; 矢量图)</h2>
    <div class="grid" id="extractedGrid"></div>
  </div>

  <script>
    const skeletalActions = [
      { file: '01-ski-glide.svg', title: '01. 滑雪：基础滑行 (Glide)' },
      { file: '02-ski-boost.svg', title: '02. 滑雪：俯冲加速 (Boost)' },
      { file: '03-ski-jump-laugh.svg', title: '03. 滑雪：腾空捧腹大笑 (Jump)' },
      { file: '04-ski-backflip.svg', title: '04. 滑雪：空中360°后空翻 (Flip)' },
      { file: '05-ski-belly-slide.svg', title: '05. 滑雪：笑倒躺滑 (Belly Slide)' },
      { file: '06-ski-crash.svg', title: '06. 滑雪：摔倒撞雪眩晕 (Crash)' },
      { file: '07-ski-ride-penguin.svg', title: '07. 滑雪：骑乘企鹅 (Penguin)' },
      { file: '08-orig-idle.svg', title: '08. 原版：侧面捧肚待机 (Idle)' },
      { file: '09-orig-run.svg', title: '09. 原版：欢快奔跑 (Run)' },
      { file: '10-orig-wave.svg', title: '10. 原版：热情招手 (Wave)' },
      { file: '11-orig-belly-laugh.svg', title: '11. 原版：捧腹露齿大笑 (Laugh)' },
      { file: '12-orig-sad-slump.svg', title: '12. 原版：沮丧蹲下 (Sad/Failed)' }
    ];

    const tracedSkiActions = [
      { file: 'traced-01-ski-glide.svg', title: '3D矢量化：基础滑行' },
      { file: 'traced-02-ski-boost.svg', title: '3D矢量化：俯冲加速' },
      { file: 'traced-03-ski-jump-laugh.svg', title: '3D矢量化：腾空大笑' },
      { file: 'traced-04-ski-backflip.svg', title: '3D矢量化：空中后空翻' },
      { file: 'traced-05-ski-belly-slide.svg', title: '3D矢量化：笑倒躺滑' },
      { file: 'traced-06-ski-crash.svg', title: '3D矢量化：摔倒撞雪' }
    ];

    const extractedSeqs = [
      { folder: 'classic-side-belly', count: 6, title: '经典45°侧面捧肚待机 (6帧)' },
      { folder: 'idle', count: 7, title: '正面微侧待机眨眼 (7帧)' },
      { folder: 'running-right', count: 8, title: '向右奔跑 (8帧)' },
      { folder: 'running-left', count: 8, title: '向左奔跑 (8帧)' },
      { folder: 'waving', count: 4, title: '热情招手 (4帧)' },
      { folder: 'belly-laugh', count: 5, title: '标志性捧腹大笑 (5帧)' },
      { folder: 'laugh-fall-down', count: 1, title: '笑倒后停留躺平 (1帧)' },
      { folder: 'sad-failed', count: 8, title: '失败垂头丧气蹲下 (8帧)' },
      { folder: 'working', count: 6, title: '执行任务思考搓手 (6帧)' },
      { folder: 'waiting', count: 6, title: '等待输入托腮 (6帧)' },
      { folder: 'review', count: 6, title: '完成待查看抱胸叉腰 (6帧)' },
      { folder: 'look-directions', count: 16, title: '16方向注视旋转 (16帧)' }
    ];

    // Stage switcher
    let currentMode = 'skeletal';
    let activeBtn = document.querySelector('#actionBtns button.active');
    const stageSvg = document.getElementById('stageSvg');
    const stageChar = document.getElementById('stageChar');

    function updateStage() {
      const file = currentMode === 'skeletal'
        ? `./ski-safari-rig/actions/${activeBtn.dataset.action}`
        : `./ski-safari-rig/traced-ski-actions/${activeBtn.dataset.traced}`;
      stageSvg.setAttribute('data', file);
      stageChar.classList.toggle('jumping', activeBtn.dataset.jump === '1');
    }

    document.getElementById('actionBtns').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      document.querySelectorAll('#actionBtns button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeBtn = btn;
      updateStage();
    });

    document.getElementById('modeBtns').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      document.querySelectorAll('#modeBtns button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      updateStage();
    });

    // Populate grids
    const skelGrid = document.getElementById('skeletalGrid');
    skeletalActions.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="preview-frame">
          <object type="image/svg+xml" data="./ski-safari-rig/actions/${item.file}"></object>
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-path">ski-safari-rig/actions/${item.file}</div>
      `;
      skelGrid.appendChild(card);
    });

    const trGrid = document.getElementById('tracedSkiGrid');
    tracedSkiActions.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="preview-frame">
          <object type="image/svg+xml" data="./ski-safari-rig/traced-ski-actions/${item.file}"></object>
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-path">ski-safari-rig/traced-ski-actions/${item.file}</div>
      `;
      trGrid.appendChild(card);
    });

    // Populate animated frame-by-frame players for extracted SVGs
    const extGrid = document.getElementById('extractedGrid');
    const framePlayers = [];
    extractedSeqs.forEach(seq => {
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = `./extracted-traced-svg/${seq.folder}/${seq.folder}-01.svg`;
      img.alt = seq.title;
      const frameBox = document.createElement('div');
      frameBox.className = 'preview-frame';
      frameBox.appendChild(img);
      card.appendChild(frameBox);
      card.insertAdjacentHTML('beforeend', `
        <div class="card-title">${seq.title}</div>
        <div class="card-path">extracted-traced-svg/${seq.folder}/</div>
      `);
      extGrid.appendChild(card);
      if (seq.count > 1) {
        framePlayers.push({ img, folder: seq.folder, count: seq.count, idx: 0 });
      }
    });

    setInterval(() => {
      framePlayers.forEach(p => {
        p.idx = (p.idx + 1) % p.count;
        const num = String(p.idx + 1).padStart(2, '0');
        p.img.src = `./extracted-traced-svg/${p.folder}/${p.folder}-${num}.svg`;
      });
    }, 140);
  </script>
</body>
</html>
