<!-- The worker bakes a repeatable district in metres. RG packs elevation,
     BA stores cloud thickness and underside. The second atlas holds albedo. -->
<script id="atlas-source" type="text/plain">
self.onmessage = ({data:{size:N, period:L}}) => {
  const count=N*N, S=L/N, mask=N-1, tau=Math.PI*2;
  const base=new Float32Array(count), surface=new Float32Array(count);
  const colors=new Uint8Array(count*4), heights=new Uint8Array(count*4);
  const cover=new Float32Array(count), groundType=new Uint8Array(count);
  let seed=90172;
  function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
  const grids=new Map();
  function noise(x,z,n){
    if(!grids.has(n)) grids.set(n,Float32Array.from({length:n*n},random));
    const g=grids.get(n); x*=n;z*=n;
    const i=Math.floor(x),j=Math.floor(z);let u=x-i,v=z-j;
    u*=u*(3-2*u);v*=v*(3-2*v);
    const a=(i%n+n)%n,b=(j%n+n)%n,c=(a+1)%n,d=(b+1)%n;
    return (g[b*n+a]*(1-u)+g[b*n+c]*u)*(1-v)+(g[d*n+a]*(1-u)+g[d*n+c]*u)*v;
  }
  const palette=[
    [64,103,105],[206,177,119],[177,166,100],[138,147,90],
    [207,127,60],[168,75,54],[218,161,69],[93,105,74],
    [126,116,130],[171,148,159],[239,224,205],[48,72,69]
  ];
  // A meandering basin opens into a chain of islands. Warped ridges flank it.
  for(let j=0;j<N;j++){
    const z=j/N;
    for(let i=0;i<N;i++){
      const x=i/N,k=j*N+i;
      const warp=noise(x,z,5)-.5;
      const shore=x-.12*Math.sin(tau*z-.25)-.058*Math.sin(2*tau*z+.7)+.09*warp;
      const side=Math.abs(Math.sin(Math.PI*shore));
      const hills=noise(x+.31,z-.17,8),detail=noise(x,z,32),grain=noise(x,z,92);
      const ridge=(1-Math.abs(2*noise(x+.17*warp,z,6)-1));
      const h=-32+side*side*(90+148*ridge*ridge+105*(noise(x,z,4)-.34))
        +47*(hills-.49)+20*(detail-.52)+5*(grain-.5)
        +47*Math.max(0,Math.cos((z-.23)*tau*3))**5*(.38+noise(x,z,7));
      base[k]=surface[k]=h;
      const wood=noise(x+.18,z,12)*.52+noise(x,z,41)*.26+hills*.22;
      let type=h<0?0:h<4.4?1:wood<.37?2:wood<.45?3:4;
      if(type===4){
        const autumn=noise(x-.31,z,18)*.68+noise(x,z,51)*.32;
        type=autumn<.32?7:autumn<.49?5:autumn>.63?6:4;
      }
      if(h>87+42*hills-24*detail)type=h>160+32*detail?10:detail>.58?9:8;
      groundType[k]=type;
    }
    if(!(j%64))postMessage({progress:4+Math.round(37*j/N)});
  }
  // Tree crowns are small raised forms. Conifers taper more sharply.
  for(let n=0;n<53000;n++){
    const x=random()*N,z=random()*N,k=(z|0)*N+(x|0),t=groundType[k];
    if(t<3||t>7||(t===3&&random()>.13))continue;
    const pine=t===7||random()<.10;
    const radius=(pine?1.1:1.25)+random()*1.65, tall=pine?7+random()*11:3+random()*5.1;
    const tint=pine?11:t;
    for(let j=Math.floor(z-radius);j<=z+radius;j++)for(let i=Math.floor(x-radius);i<=x+radius;i++){
      const rr=((i-x)**2+(j-z)**2)/(radius*radius);
      if(rr>=1)continue;
      const idx=(j&mask)*N+(i&mask);
      const top=base[k]+tall*(pine?1-Math.sqrt(rr):Math.sqrt(1-rr));
      if(top>surface[idx]){surface[idx]=top;groundType[idx]=tint}
    }
  }
  postMessage({progress:52});
  // Connected ellipsoidal lobes make banks with a flat base and domed tops.
  for(let g=0;g<48;g++){
    const cx=random()*N,cz=random()*N;
    if(Math.min(cx,N-cx)<N*.10 && (cz<N*.18||cz>N*.94))continue;
    const scale=.72+random()*.9;
    for(let n=0;n<13;n++){
      const x=cx+(random()-.5)*50*scale,z=cz+(random()-.5)*22*scale;
      const rx=(8+random()*13)*scale,rz=rx*(.7+random()*.5),rise=(10+random()*26)*scale;
      for(let j=Math.floor(z-rz);j<z+rz;j++)for(let i=Math.floor(x-rx);i<x+rx;i++){
        const rr=((i-x)/rx)**2+((j-z)/rz)**2;
        if(rr<1){const k=(j&mask)*N+(i&mask);cover[k]=Math.max(cover[k],Math.sqrt(1-rr)*rise)}
      }
    }
  }
  for(let j=0;j<N;j++){
    for(let i=0;i<N;i++){
      const k=j*N+i,p=k*4,h=surface[k],t=groundType[k],c=palette[t];
      const slope=(surface[((j+1)&mask)*N+i]-surface[((j-1)&mask)*N+i])/(2*S);
      const east=(surface[j*N+((i+1)&mask)]-surface[j*N+((i-1)&mask)])/(2*S);
      let occlusion=0;
      for(let d=3;d<=105;d=Math.ceil(d*1.47)){
        const y=surface[((j+Math.round(d*.94))&mask)*N+((i+Math.round(d*.34))&mask)];
        occlusion=Math.max(occlusion,(y-h)/(d*S)-.16);
      }
      const shade=Math.max(-.35,Math.min(.26,-.39*slope-.14*east));
      const light=Math.round((shade-Math.min(.30,occlusion*.60)+(random()-.5)*.09)*8)/8;
      for(let a=0;a<3;a++)colors[p+a]=Math.max(0,Math.min(255,c[a]+light*[119,102,57][a]));
      colors[p+3]=255;
      const code=Math.max(0,Math.min(65535,Math.round((h+80)*128)));
      heights[p]=code>>8;heights[p+1]=code&255;heights[p+2]=Math.round(cover[k]*3);
      heights[p+3]=Math.round(83+16*noise(i/N,j/N,6)+3*noise(i/N,j/N,34));
    }
    if(!(j%64))postMessage({progress:60+Math.round(39*j/N)});
  }
  postMessage({progress:100,heights:heights.buffer,colors:colors.buffer},[heights.buffer,colors.buffer]);
};
</script>
<script id="quad-vs" type="text/plain">#version 300 es
void main(){
  vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);
  gl_Position=vec4(p*2.-1.,0.,1.);
}</script>
<script id="world-fs" type="text/plain">#version 300 es
precision highp float;
uniform sampler2D atlas,paint;
uniform vec2 res;
uniform vec3 eye,forward,right,up,jet;
uniform vec2 course;
uniform float clock, lens, period;
uniform int markCount;
uniform vec4 marks[16];
out vec4 frag;
const vec3 sun=vec3(.338,.145,.930);
float bayer(){
  ivec2 p=ivec2(gl_FragCoord.xy)&3;
  int m[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return (float(m[p.x+4*p.y])+.5)/16.;
}
float band(float v,float n,float d){return floor(clamp(v,0.,.99999)*n+d)/n;}
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.11369,.13787));q+=dot(q,q.yzx+19.19);return fract((q.x+q.y)*q.z);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
vec3 rgb(float r,float g,float b){return vec3(r,g,b)/255.;}
vec4 field(vec2 p){return textureLod(atlas,p/period,0.);}
float heightOf(vec4 s){return dot(s.rg,vec2(65280.,255.))/128.-80.;}
vec3 haze(vec3 rd){
  float warm=smoothstep(.16,.99,dot(normalize(rd.xz+vec2(.00001)),normalize(sun.xz)));
  return mix(rgb(182.,153.,181.),rgb(245.,182.,134.),warm);
}
vec3 sky(vec3 d,float dith){
  float facing=max(0.,dot(d,sun));
  vec3 belt=haze(d);
  float elev=clamp(d.y,0.,1.);
  vec3 col=mix(belt,rgb(218.,150.,151.),band(smoothstep(0.,.22,elev),11.,dith));
  col=mix(col,rgb(137.,125.,163.),band(smoothstep(.12,.53,elev),14.,dith));
  col=mix(col,rgb(85.,108.,148.),band(smoothstep(.48,.99,elev),11.,dith));
  float halo=pow(facing,26.);
  col=mix(col,rgb(255.,213.,148.),band(halo*.88,11.,dith));
  float disc=dot(d,sun);
  if(disc>.9980)col=d.y<.127?rgb(255.,217.,139.):rgb(255.,237.,174.);
  vec2 skyUv=d.xz/max(.038,d.y+.12);
  float streak=noise(skyUv*vec2(.83,6.6)+vec2(clock*.001,5.))*.64+noise(skyUv*vec2(2.2,22.))*.36;
  if(streak>.58 && d.y>.055 && d.y<.7){
    float w=band(smoothstep(.58,.72,streak)*.80,5.,dith);
    col=mix(col,mix(rgb(216.,151.,158.),rgb(255.,211.,165.),band(facing*facing,5.,dith)),w);
  }
  // Far ridgelines sit beyond the finite terrain trace and wrap in azimuth.
  vec2 dir=normalize(d.xz+vec2(.00001));
  float ridge=.028+.075*noise(dir*6.+4.)+.047*noise(dir*19.)+.018*noise(dir*57.);
  if(d.y<ridge)col=mix(belt,rgb(149.,123.,157.),.40);
  if(d.y<ridge*.73-.008+.012*noise(dir*37.))col=mix(belt,rgb(137.,115.,148.),.48);
  return col;
}
float jetShadow(vec3 p){
  float dy=jet.y-p.y;if(dy<0.||dy>470.)return 0.;
  vec2 rel=p.xz-(jet.xz-sun.xz*dy*.68);
  vec2 a=abs(vec2(dot(rel,vec2(course.y,-course.x)),dot(rel,course)));
  float z=dot(rel,course);
  return float((a.x<2.7&&a.y<13.)||(a.x<13.&&z<4.-a.x*.48&&z>-.28*a.x-4.)||(a.x<6.5&&z< -7.&&z> -12.));
}
vec3 sea(vec3 p,vec3 rd,float ground,float di){
  float dep=-ground;
  vec3 c=dep<4.?rgb(113.,164.,148.):dep<10.?rgb(81.,148.,146.):dep<19.?rgb(66.,123.,139.):dep<31.?rgb(61.,101.,128.):rgb(55.,82.,116.);
  float rip=noise(vec2(p.x*.049+p.z*.012,p.z*.25-clock*1.2));
  float skyLight=pow(1.-clamp(-rd.y,0.,1.),3.);
  c=mix(c,haze(rd),band(skyLight*.48,6.,di));
  if(rip>.70)c+=rgb(18.,22.,21.);
  float a=dot(normalize(rd.xz+vec2(.00001)),normalize(sun.xz));
  float path=smoothstep(.90,1.,a)*smoothstep(.54,1.,1.+rd.y);
  if(rip>.95-.47*path && path>.03)c=mix(c,rgb(252.,193.,117.),band(path*(.53+.45*rip),6.,di));
  if(path>.32 && rip>.90-path*.26)c=mix(c,rgb(255.,225.,157.),.72);
  if((dep<3.5 && fract(dep*.32-clock*.48+rip*.4)>.68)||(rip>.945&&noise(floor(p.xz*.21)+floor(clock*3.))>.66))c=rgb(212.,218.,180.);
  return c;
}
void main(){
  float di=bayer();
  vec2 uv=(gl_FragCoord.xy*2.-res)/res.y;
  vec3 rd=normalize(forward+(right*uv.x+up*uv.y)*lens);
  float t=.5,prev=t;int hit=0;
  if(eye.y>300.&&rd.y<-.001)t=max(t,(300.-eye.y)/rd.y);
  for(int i=0;i<143;i++){
    vec3 p=eye+rd*t;
    if(t>5300.||(p.y>310.&&rd.y>=0.))break;
    vec4 s=field(p.xz);
    float floorY=max(0.,heightOf(s)),delta=p.y-floorY;
    float puff=s.b*85.,base=s.a*255.;
    float cloud=puff>.9?max(p.y-base-puff,base-puff*.12-p.y):900.;
    if(min(delta,cloud)<=.05){hit=delta<cloud?1:2;break;}
    prev=t;
    float stepT=max(1.6+t*.003,delta/(max(-rd.y,0.)+.47));
    if(p.y>78. && p.y<162.)stepT=min(stepT,max(5.+t*.003,cloud*.72));
    else if(rd.y<0.&&p.y>=162.)stepT=min(stepT,(p.y-162.)/-rd.y+3.);
    else if(rd.y>0.&&p.y<=78.)stepT=min(stepT,(78.-p.y)/rd.y+3.);
    t+=clamp(stepT,1.2,70.+t*.027);
  }
  vec3 c;
  float depth=1.;
  if(hit==0)c=sky(rd,di);
  else{
    for(int n=0;n<5;n++){
      float m=(prev+t)*.5;vec3 q=eye+rd*m;vec4 s=field(q.xz);
      bool inside=hit==1?q.y<=max(0.,heightOf(s)):(s.b>.0106 && q.y<=s.a*255.+s.b*85.&&q.y>=s.a*255.-s.b*10.2);
      if(inside)t=m;else prev=m;
    }
    vec3 p=eye+rd*t;vec4 s=field(p.xz);float ground=heightOf(s);
    if(hit==2){
      float side=(s.b-field(p.xz+sun.xz*7.).b)*5.;
      float scallop=noise(p.xz*.085)*.09+noise(p.xz*.032)*.12;
      float tone=(p.y-s.a*255.)*.020+side+scallop-.09;
      c=tone<.05?rgb(158.,139.,168.):tone<.32?rgb(197.,165.,176.):tone<.65?rgb(229.,186.,178.):tone<.92?rgb(250.,208.,180.):rgb(255.,227.,192.);
    }else{
      c=ground<.05?sea(p,rd,ground,di):textureLod(paint,p.xz/period,0.).rgb;
      float cloudCover=field(p.xz+sun.xz*max(0.,103.-p.y)*1.5).b;
      if(p.y<104.&&cloudCover>.025)c=mix(c,rgb(91.,80.,118.),.27);
      for(int i=0;i<16;i++){
        if(i>=markCount)break;
        vec4 m=marks[i];float r=distance(p.xz,m.xy);
        if(r>100.)continue;
        if(ground>.05 && m.w>0. && r<9.+noise(floor(p.xz*.25))*8.)
          c=r<10. && hash(floor(p.xz))>.85 && m.z<6.?rgb(238.,126.,65.):mix(c,rgb(57.,48.,62.),.75);
        if(abs(r-(m.z*33.+2.))<1.9 && m.z<2.5)c=mix(c,rgb(255.,225.,176.),1.-m.z*.32);
        if(ground<.05 && m.w<0. && m.z<2.4 && abs(r-(7.+m.z*18.))<2.8)c=rgb(224.,230.,201.);

const life=new AbortController();let flightInputs,enabled=true,hostMute=false,hiddenForCache=false;
function listen(el,name,fn,options={}){el.addEventListener(name,fn,{...options,signal:life.signal})}

function canRun(){return ready&&!dead&&!lost&&enabled&&focused&&!document.hidden&&!hiddenForCache&&mode!=='paused'}
function clearFlightInputs(){flightInputs?.abort();flightInputs=null;clearControls()}
function bindFlightInputs(){
  if(flightInputs||!canRun()||mode!=='flight')return;
  flightInputs=new AbortController();
  const on=(el,name,fn,opts={})=>el.addEventListener(name,fn,{...opts,signal:flightInputs.signal});
  function aim(x,y){
    const r=stage.getBoundingClientRect();
    pointer={x:clamp((x-r.left)/r.width*2-1,-1,1),y:clamp((y-r.top)/r.height*2-1,-1,1)};
  }
  const fromControl=e=>e.target instanceof Element&&!!e.target.closest('button');
  on(stage,'mousemove',e=>{if(!fromControl(e))aim(e.clientX,e.clientY)});
  on(stage,'mousedown',e=>{
    if(fromControl(e))return;
    e.preventDefault();stage.focus({preventScroll:true});
    if(e.button===0){leftHeld=true;heldAt=0}
    if(e.button===2)fire();
  });
  on(window,'mouseup',e=>{if(e.button===0&&leftHeld){if(heldAt<=.17)roll();leftHeld=false}});
  on(stage,'contextmenu',e=>e.preventDefault());
  let touchId=null;
  on(stage,'pointerdown',e=>{
    if(e.pointerType==='mouse'||fromControl(e)||touchId!==null)return;
    touchId=e.pointerId;stage.setPointerCapture(touchId);aim(e.clientX,e.clientY);e.preventDefault();
  });
  on(stage,'pointermove',e=>{if(e.pointerId===touchId)aim(e.clientX,e.clientY)});
  function releaseTouch(e){if(e.pointerId===touchId){touchId=null;pointer={x:0,y:0}}}
  on(stage,'pointerup',releaseTouch);on(stage,'pointercancel',releaseTouch);
  for(const [id,action] of [['touch-view',setView],['touch-roll',roll],['touch-fire',fire]]){
    on($(id),'pointerdown',e=>{if(e.button===0){e.preventDefault();action()}});
    on($(id),'click',e=>{if(e.detail===0)action()});
  }
  on($('touch-boost'),'pointerdown',e=>{e.preventDefault();touchBoost=true;e.currentTarget.setPointerCapture(e.pointerId)});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])on($('touch-boost'),event,()=>{touchBoost=false});
  const supported=['Space','KeyF','Escape','KeyP','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'];
  on(window,'keydown',e=>{
    if(!supported.includes(e.code)||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.code==='Space'&&fromControl(e))return;
    e.preventDefault();e.stopPropagation();keys.add(e.code);
    if(e.repeat)return;
    if(e.code==='Space')setView();else if(e.code==='KeyF')fire();else if(e.code==='Escape'||e.code==='KeyP')pauseFlight();

}

function stopLoop(){cancelAnimationFrame(raf);raf=0;previous=0;clearFlightInputs()}
function reconcile(){
  if(!canRun())stopLoop();

    bindFlightInputs();

function tick(now){
  raf=0;if(!canRun())return;
  const ms=previous?Math.max(1,now-previous):16.67;previous=now;
  const dt=Math.min(ms*.001,.085);governor+=dt;frameMean=lerp(frameMean,Math.min(ms,150),.04);

    if(frameMean>26&&resLevel<4)resLevel++;

  }

  while(remaining>.00001){const step=Math.min(remaining,1/55);simulate(step);remaining-=step}
