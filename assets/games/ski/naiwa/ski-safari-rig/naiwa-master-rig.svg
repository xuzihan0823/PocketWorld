        <rect x="106" y="15.5" width="30" height="12" rx="6" transform="rotate(-4 120 21)" fill="url(#goggleLensGrad)"/>
        <!-- Lens Glint -->
        <path d="M110,18 L116,16.5 L113,25 L108,25 Z" fill="#FFFFFF" opacity="0.65"/>
        <!-- Determined Grin -->
        <path d="M121,34 Q130,35 136,31" fill="none" stroke="#6E4B1B" stroke-width="1.8" stroke-linecap="round"/>
      </g></g>
      <g id="expr-dizzy" style="display:none">      <g id="face-dizzy">
        <ellipse cx="113" cy="22.5" rx="8.5" ry="8" fill="url(#eyeGreenGrad)"/>
        <path d="M113,22 m-4,0 a4,4 0 1,0 8,0 a3,3 0 1,0 -6,0 a1.5,1.5 0 1,0 3,0" fill="none" stroke="#141A15" stroke-width="1.7" stroke-linecap="round"/>
        <ellipse cx="126" cy="34" rx="5.5" ry="3.8" fill="#4A1210"/>
        <ellipse cx="126" cy="35.5" rx="3.5" ry="1.8" fill="#C83E31"/>
      </g></g>
      <g id="expr-sad" style="display:none">      <g id="face-sad">
