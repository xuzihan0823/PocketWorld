<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="280" height="260">
  <defs>
    <!-- 3D-like Yellow Body Gradient -->
    <radialGradient id="bodyGrad" cx="58%" cy="30%" r="70%" fx="64%" fy="22%">
      <stop offset="0%" stop-color="#FFF48C"/>
      <stop offset="36%" stop-color="#FAD149"/>
      <stop offset="76%" stop-color="#E3A52C"/>
      <stop offset="100%" stop-color="#C4821A"/>
    </radialGradient>
    <!-- Belly Cream 3D Gradient -->
    <radialGradient id="bellyGrad" cx="64%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#FFF8E6"/>
      <stop offset="55%" stop-color="#F3DFC1"/>
      <stop offset="88%" stop-color="#DFC195"/>
      <stop offset="100%" stop-color="#C9A878"/>
    </radialGradient>
    <!-- Frog Green Eyelid Gradient -->
    <radialGradient id="eyeGreenGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B5E2A1"/>
      <stop offset="58%" stop-color="#86B87A"/>
      <stop offset="100%" stop-color="#58854F"/>
    </radialGradient>
    <!-- Arm Yellow-to-Cocoa-Brown Gradient (Front Arm) -->
    <linearGradient id="armFrontGrad" x1="12%" y1="15%" x2="92%" y2="85%">
      <stop offset="0%" stop-color="#F7CA44"/>
      <stop offset="42%" stop-color="#E3A42B"/>
      <stop offset="68%" stop-color="#9A7240"/>
      <stop offset="86%" stop-color="#614728"/>
      <stop offset="100%" stop-color="#3E2D18"/>
    </linearGradient>
    <!-- Raised Wave Arm Gradient -->
    <linearGradient id="armWaveGrad" x1="20%" y1="85%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#F7CA44"/>
      <stop offset="45%" stop-color="#E3A42B"/>
      <stop offset="72%" stop-color="#8F693B"/>
      <stop offset="100%" stop-color="#3E2D18"/>
    </linearGradient>
    <!-- Back Hand Brown Gradient -->
    <linearGradient id="handBackGrad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#8A6438"/>
      <stop offset="55%" stop-color="#594024"/>
      <stop offset="100%" stop-color="#382815"/>
    </linearGradient>
    <!-- Leg Yellow-to-Brown Foot Gradient -->
    <linearGradient id="legGrad" x1="45%" y1="0%" x2="55%" y2="96%">
      <stop offset="0%" stop-color="#DF9E26"/>
      <stop offset="48%" stop-color="#CC8B20"/>
      <stop offset="74%" stop-color="#856035"/>
      <stop offset="90%" stop-color="#573F22"/>
      <stop offset="100%" stop-color="#382814"/>
    </linearGradient>
    <!-- Back Leg Darker Gradient -->
    <linearGradient id="legBackGrad" x1="45%" y1="0%" x2="55%" y2="96%">
      <stop offset="0%" stop-color="#C98A1E"/>
      <stop offset="48%" stop-color="#B07516"/>
      <stop offset="74%" stop-color="#70502B"/>
      <stop offset="100%" stop-color="#332411"/>
    </linearGradient>
    <!-- Ski Safari Red Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#FF525E"/>
      <stop offset="58%" stop-color="#E62E3D"/>
      <stop offset="100%" stop-color="#A81623"/>
    </linearGradient>
    <!-- Ski Board Gradient -->
    <linearGradient id="skiBoardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B2D42"/>
      <stop offset="15%" stop-color="#EF233C"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="82%" stop-color="#EF233C"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <!-- Ski Goggles Lens Gradient -->
    <linearGradient id="goggleLensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#F15BB5"/>
    </linearGradient>
    <!-- Boost Flame Gradient -->
    <linearGradient id="flameGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#FFF8B8"/>
      <stop offset="30%" stop-color="#FF9F1C"/>
      <stop offset="70%" stop-color="#E71D36" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#141E2B" flood-opacity="0.28"/>
    </filter>
  </defs>
