<!doctype html><meta charset="utf-8"><title>Replacement asset inspection</title>
<style>body{margin:0;background:#333;color:white;font:14px monospace}#grid{display:grid;grid-template-columns:repeat(5,1fr)}article{height:310px;position:relative;border:1px solid #555}canvas{width:100%;height:280px}span{position:absolute;bottom:5px;left:8px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><div id="grid"></div>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const params=new URLSearchParams(location.search);const names=params.has('name')?[params.get('name')]:['planner.parts','hatch','turntable.parts','bed','lamp.parts','computer.fitted','cabinet.parts','rolling-chair.parts','keyboard.parts','plant','journal.parts','storage-box','lounge-chair.parts','cartridge','desk.parts'];
if(names.length===1){grid.style.gridTemplateColumns='600px';document.querySelector('style').textContent+='article{height:610px}canvas{height:580px}';}
for(const name of names){const height=names.length===1?580:280;const card=document.createElement('article');card.innerHTML=`<span>${name}</span>`;grid.append(card);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(card.clientWidth,height);renderer.setPixelRatio(1);renderer.setClearColor('#545c64');card.prepend(renderer.domElement);const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x777777,2.5));const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,4,3);scene.add(light);const camera=new T.PerspectiveCamera(35,card.clientWidth/height,.01,100);try{const g=await new GLTFLoader().loadAsync('/models/replaced/'+name+'.glb');const b=new T.Box3().setFromObject(g.scene),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());g.scene.position.sub(c);scene.add(g.scene);const size=Math.max(...s.toArray());camera.position.set(size*1.25,size*.85,size*1.7);if(params.get('view')==='top')camera.position.set(0,size*2.1,.0001);if(params.get('view')==='front')camera.position.set(0,size*.05,size*2.1);camera.lookAt(0,0,0);card.querySelector('span').textContent=name+' '+s.toArray().map(n=>n.toFixed(2)).join('×');renderer.render(scene,camera);}catch(e){card.querySelector('span').textContent=name+' pending';}}
</script>
